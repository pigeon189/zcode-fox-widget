<svg width="1080" height="208" viewBox="0 0 1080 208" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DeepSeek API Key 的三步查找顺序">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI Variable Text', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
    .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Courier New', monospace; }
  </style>
  <rect x="24" y="18" width="316" height="150" rx="12" fill="#FBEDE3" stroke="#F0C9AF"/>
  <rect x="42" y="34" width="30" height="4" rx="2" fill="#D9772E"/>
  <text x="42" y="58" class="mono" font-size="10.5" letter-spacing="1.6" fill="#8A857E">STEP 01</text>
  <text x="42" y="82" class="sans" font-size="18" font-weight="700" letter-spacing="-0.3" fill="#23211F">环境变量</text>
  <text x="42" y="106" class="sans" font-size="12.5" fill="#6B6660">DEEPSEEK_API_KEY</text>
  <text x="42" y="125" class="sans" font-size="12.5" fill="#6B6660">适合临时 / 多账号切换</text>
  <rect x="370" y="18" width="316" height="150" rx="12" fill="#FFFFFF" stroke="#E7E2DA"/>
  <rect x="388" y="34" width="30" height="4" rx="2" fill="#576082"/>
  <text x="388" y="58" class="mono" font-size="10.5" letter-spacing="1.6" fill="#8A857E">STEP 02</text>
  <text x="388" y="82" class="sans" font-size="18" font-weight="700" letter-spacing="-0.3" fill="#23211F">插件配置</text>
  <text x="388" y="106" class="sans" font-size="12.5" fill="#6B6660">~/.zcode/whale/config.json 的 apiKey</text>
  <text x="388" y="125" class="sans" font-size="12.5" fill="#6B6660">可用 cli.mjs key 写入，密钥走 stdin</text>
  <rect x="716" y="18" width="316" height="150" rx="12" fill="#FFFFFF" stroke="#E7E2DA"/>
  <rect x="734" y="34" width="30" height="4" rx="2" fill="#576082"/>
  <text x="734" y="58" class="mono" font-size="10.5" letter-spacing="1.6" fill="#8A857E">STEP 03</text>
  <text x="734" y="82" class="sans" font-size="18" font-weight="700" letter-spacing="-0.3" fill="#23211F">ZCode 里已有的 provider</text>
  <text x="734" y="106" class="sans" font-size="12.5" fill="#6B6660">baseURL 指向 api.deepseek.com 的接入点</text>
  <text x="734" y="125" class="sans" font-size="12.5" fill="#6B6660">复用现成配置，零配置可用</text>
  <line x1="351" y1="93" x2="358" y2="93" stroke="#B3ADA4" stroke-width="1.6"/>
  <path d="M354 88.5 L360 93 L354 97.5" stroke="#B3ADA4" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="697" y1="93" x2="704" y2="93" stroke="#B3ADA4" stroke-width="1.6"/>
  <path d="M700 88.5 L706 93 L700 97.5" stroke="#B3ADA4" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="24" y="194" class="sans" font-size="12" fill="#8A857E">命中即停；三条都没命中时，只有 DeepSeek 余额卡显示「未找到 API Key」，其余功能照常。</text>
</svg>
