<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src http://127.0.0.1:* http://localhost:*; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>fox-dock overlay</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body data-menu-button="hover">
    <div id="say" role="status" aria-live="polite" hidden><span id="say-text"></span></div>

    <div id="bubble" role="status" aria-live="polite" hidden>
      <div class="bubble-main"><span id="bubble-text"></span></div>
      <div class="bubble-sub" id="bubble-sub"></div>
    </div>

    <div id="chip" hidden>
      <span id="chip-dot" class="chip-dot" aria-hidden="true"></span>
      <span class="chip-copy">
        <span id="chip-adapter"></span>
        <span id="chip-value"></span>
      </span>
      <svg id="chip-ring" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="2.5" />
        <circle id="chip-ring-value" cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-dasharray="43.98" stroke-dashoffset="43.98" transform="rotate(-90 9 9)" />
      </svg>
      <span id="chip-unlink" class="chip-unlink" hidden title="悬浮中" aria-label="悬浮中">↺</span>
    </div>

    <div id="quick" role="dialog" aria-label="快览" hidden>
      <div class="quick-head">
        <span id="quick-dot" class="quick-dot" aria-hidden="true"></span>
        <span id="quick-agent" class="quick-agent"></span>
        <span id="quick-status" class="quick-status"></span>
        <span class="spacer"></span>
        <button id="quick-refresh" type="button" class="icon-btn" aria-label="刷新">↻</button>
        <button id="quick-more" type="button" class="icon-btn" aria-label="更多">⋯</button>
      </div>
      <div id="quick-value" class="quick-value"></div>
      <div id="quick-sub" class="quick-sub"></div>
      <div class="quick-context">
        <span class="quick-label">上下文</span>
        <span class="quick-bar"><i id="quick-ctx-bar"></i></span>
        <span id="quick-ctx-pct" class="quick-pct"></span>
        <span id="quick-ctx-abs" class="quick-abs"></span>
      </div>
      <div id="quick-windows"></div>
    </div>

    <div id="menu" role="group" aria-label="宠物菜单" hidden></div>
    <div id="drag-hint" hidden></div>

    <div id="fox" title="拖动可吸附到宿主窗口；单击打开快览">
      <img id="fox-img" src="assets/roles/fox.png" alt="角色" draggable="false" />
      <span id="fox-badge" hidden></span>
      <button id="pet-menu" type="button" title="打开菜单" aria-label="打开菜单">⋯</button>
    </div>

    <script src="roles.js"></script>
    <script src="pet.js"></script>
  </body>
</html>
