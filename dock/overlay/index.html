<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fox-dock overlay</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="bubble" hidden>
      <span id="bubble-text"></span>
      <span id="bubble-sub"></span>
    </div>
    <div id="chip" hidden>
      <span id="chip-adapter"></span>
      <span id="chip-value"></span>
    </div>
    <div id="panel" hidden>
      <div class="panel-head">
        <span id="panel-title">—</span>
        <button id="panel-close" type="button" title="关闭">×</button>
      </div>
      <div class="panel-tabs">
        <button type="button" data-tab="detail" class="active">明细</button>
        <button type="button" data-tab="settings">设置</button>
        <button type="button" data-tab="about">关于</button>
      </div>
      <div id="panel-body"></div>
    </div>
    <div id="fox" title="拖到 agent 窗口上；单击看明细">🦊</div>
    <script src="renderer.js"></script>
  </body>
</html>
