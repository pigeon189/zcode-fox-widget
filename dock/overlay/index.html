<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src http://127.0.0.1:* http://localhost:*; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>fox-dock overlay</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body data-menu-button="hover">
    <div id="say" role="status" aria-live="polite" hidden><span id="say-text"></span></div>

    <div id="bubble" role="status" aria-live="polite" hidden>
      <div class="bubble-main"><span id="bubble-text"></span></div>
      <div class="bubble-sub" id="bubble-sub"></div>
    </div>

    <div id="chip" hidden>
      <span id="chip-dot" class="chip-dot" aria-hidden="true"></span>
      <span class="chip-copy">
        <span id="chip-adapter"></span>
        <span id="chip-value"></span>
      </span>
      <svg id="chip-ring" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="2.5" />
        <circle id="chip-ring-value" cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-dasharray="43.98" stroke-dashoffset="43.98" transform="rotate(-90 9 9)" />
      </svg>
      <span id="chip-multi" class="chip-multi" role="status" hidden></span>
    </div>

    <div id="quick" role="dialog" aria-label="快览" hidden>
      <div class="quick-head">
        <span id="quick-dot" class="quick-dot" aria-hidden="true"></span>
        <span id="quick-agent" class="quick-agent"></span>
        <span id="quick-status" class="quick-status"></span>
        <span class="spacer"></span>
        <button id="quick-refresh" type="button" class="icon-btn quick-refresh" aria-label="刷新">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
            <path d="M3 21v-5h5" />
          </svg>
        </button>
      </div>
      <div id="quick-value" class="quick-value"></div>
      <div id="quick-sub" class="quick-sub"></div>
      <div id="quick-period" class="quick-period" hidden>
        <span class="period-dot" aria-hidden="true"></span>
        <span id="quick-period-label"></span>
        <span id="quick-period-count" class="period-count"></span>
      </div>
      <div class="quick-context">
        <span class="quick-label">上下文</span>
        <span class="quick-bar"><i id="quick-ctx-bar"></i></span>
        <span id="quick-ctx-pct" class="quick-pct"></span>
        <span id="quick-ctx-abs" class="quick-abs"></span>
      </div>
      <div id="quick-windows"></div>
      <div id="quick-sessions" class="quick-sessions" hidden>
        <div class="quick-label">会话</div>
        <div id="quick-session-list"></div>
      </div>
    </div>

    <div id="perm" role="alertdialog" aria-label="权限请求" data-testid="perm.card" hidden>
      <div class="perm-head">
        <span id="perm-agent" class="perm-agent"></span>
        <span id="perm-risk" class="perm-risk" data-testid="perm.risk" hidden>高风险</span>
      </div>
      <div id="perm-tool" class="perm-tool" data-testid="perm.tool"></div>
      <div id="perm-preview" class="perm-preview" data-testid="perm.preview"></div>
      <div id="perm-expired" class="perm-expired" data-testid="perm.expired" hidden>已超时，请在宿主窗口处理</div>
      <div class="perm-actions">
        <button id="perm-focus" type="button" class="perm-btn" data-testid="perm.focus">去宿主处理</button>
        <button id="perm-deny" type="button" class="perm-btn perm-danger" data-testid="perm.deny">拒绝</button>
        <button id="perm-allow" type="button" class="perm-btn perm-primary" data-testid="perm.allow">允许一次</button>
      </div>
    </div>

    <div id="menu" role="group" aria-label="宠物菜单" hidden></div>
    <div id="drag-hint" hidden></div>

    <div id="fox">
      <img id="fox-img" src="assets/roles/fox.png" alt="角色" draggable="false" />
      <button id="pet-menu" type="button" title="打开菜单" aria-label="打开菜单">⋯</button>
    </div>

    <script src="roles.js"></script>
    <script src="pet.js"></script>
  </body>
</html>
