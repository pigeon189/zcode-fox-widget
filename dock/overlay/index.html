<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src http://127.0.0.1:* http://localhost:*; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>fox-dock overlay</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="say" role="status" aria-live="polite" hidden>
      <span id="say-text"></span>
    </div>

    <div id="bubble" role="status" aria-live="polite" hidden>
      <div class="bubble-main"><span id="bubble-text"></span></div>
      <div class="bubble-sub" id="bubble-sub"></div>
    </div>

    <div id="chip" hidden>
      <span id="chip-dot" aria-hidden="true"></span>
      <span class="chip-copy">
        <span id="chip-adapter"></span>
        <span id="chip-value"></span>
      </span>
      <span class="chip-chevron" aria-hidden="true">›</span>
    </div>

    <div id="panel" hidden>
      <div class="panel-head">
        <div class="panel-brand">
          <span id="panel-accent" aria-hidden="true"></span>
          <span id="panel-title">—</span>
        </div>
        <div class="panel-head-actions">
          <span id="panel-fresh" class="panel-fresh" title="数据新鲜度"></span>
          <button id="panel-close" type="button" title="关闭">×</button>
        </div>
      </div>
      <div class="panel-tabs" role="tablist">
        <button type="button" data-tab="detail" class="active">总览</button>
        <button type="button" data-tab="quota">额度</button>
        <button type="button" data-tab="vendors">厂商</button>
        <button type="button" data-tab="usage">用量</button>
        <button type="button" data-tab="roles">角色</button>
        <button type="button" data-tab="settings">设置</button>
        <button type="button" data-tab="about">关于</button>
      </div>
      <div id="panel-body"></div>
    </div>

    <div id="fox" title="拖到 agent 窗口上吸附；单击打开面板">
      <img id="fox-img" src="assets/roles/fox.png" alt="角色" draggable="false" />
      <span id="fox-badge" hidden></span>
      <button id="pet-menu" type="button" title="打开面板" aria-label="打开面板">⋯</button>
    </div>

    <script src="roles.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
